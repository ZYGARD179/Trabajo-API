<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card shadow-sm p-4">
      <h4 class="mb-4 text-center">Deja tu comentario</h4>

      <!-- Correo electrónico -->
      <div class="mb-3">
        <label for="emailInput" class="form-label">Tu Correo Electrónico</label>
        <input
          type="email"
          class="form-control"
          id="emailInput"
          placeholder="name@example.com">
      </div>

      <!-- Mensaje -->
      <div class="mb-3">
        <label for="messageTextarea" class="form-label">Tu Mensaje</label>
        <textarea
          class="form-control"
          id="messageTextarea"
          rows="4"
          placeholder="Escribe tu mensaje aquí..."></textarea>
      </div>

      <!-- Botón enviar -->
      <div class="text-center">
        <button type="submit" class="btn btn-primary w-50">Enviar</button>
      </div>
    </div>
  </div>
</div>
